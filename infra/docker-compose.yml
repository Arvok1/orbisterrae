services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: orbis
      POSTGRES_PASSWORD: orbis
      POSTGRES_DB: orbis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  nats:
    image: nats:2
    command: ["-js"]
    ports: ["4222:4222", "8222:8222"]
volumes:
  pgdata:
