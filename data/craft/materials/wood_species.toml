# Espécies base. Valores = média da espécie; cada lote varia por terroir, idade, abate, secagem.
# Unidades normalizadas 0..1 salvo indicação. 'terroir_sensitivity' define quanto o sítio altera cada eixo.
[[species]]
id = "oak_quercus"
class = "wood"
biomes = ["temperate_forest", "mediterranean"]
props = { density = 0.68, stiffness = 0.62, strength = 0.66, toughness = 0.60, rot_resistance = 0.70, workability = 0.45, straightness = 0.55, tannin = 0.70, teredo_resistance = 0.35 }
terroir_sensitivity = { density = 0.20, strength = 0.18, straightness = 0.25 }
shape_tendency = "curved_branches"   # bom para cavernas e curvas naturais

