name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  network:
    name: Gateway and NATS integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: orbis
          POSTGRES_PASSWORD: orbis
          POSTGRES_DB: orbis
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U orbis -d orbis" --health-interval 5s --health-timeout 5s --health-retries 10
      nats:
        image: nats:2
        ports: ["4222:4222"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orbis/protocol build
      - run: cargo build -p orbis-gateway --bins
      - run: cargo test -p orbis-gateway --test persistence -- --ignored
      - run: pwsh -NoProfile -File tools/test-first-village.ps1
      - name: Check 1000 connections through gateway and worker
        run: |
          target/debug/orbis-shard-worker --slot 0 > worker0.log 2>&1 &
          worker0_pid=$!
          target/debug/orbis-shard-worker --slot 1 > worker1.log 2>&1 &
          worker1_pid=$!
          target/debug/orbis-gateway > gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$worker0_pid" "$worker1_pid" "$gateway_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -sf http://127.0.0.1:8080/ready; then break; fi
            sleep 1
          done
          node tools/gateway-smoke.mjs
          pnpm bots:p0

  world-pipeline:
    name: World pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tools/world-pipeline/compose.yml build
      - run: docker compose -f tools/world-pipeline/compose.yml run --rm --entrypoint python world -m unittest discover -s tools/world-pipeline

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec buf build
      - run: pnpm exec buf generate
      - run: pnpm --filter @orbis/protocol build
      - run: git diff --exit-code -- packages/protocol/src/generated
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @orbis/client build
