syntax = "proto3";
package orbis.v1;
option csharp_namespace = "Orbis.V1";

message LatLon { double lat = 1; double lon = 2; }

message Envelope {
  uint64 seq = 1;
  oneof body { Command command = 2; ServerMsg server = 3; }
}

message Command {
  string request_id = 1;
  oneof kind {
    FoundCity found_city = 10;
    SetViewport viewport = 11;
    Authenticate authenticate = 12;
    MoveRuler move_ruler = 13;
    InspectCity inspect_city = 14;
    ApplyCityEdits apply_city_edits = 15;
    QueueBuilding queue_building = 16;
    CancelConstruction cancel_construction = 17;
    AdminSnapshotRequest admin_snapshot = 30;
    CreateDesign create_design = 20;
    StartCraft start_craft = 21;
    ResolveCheckpoint resolve_checkpoint = 22;
    // Economy (S1.3)
    CreateCaravan create_caravan = 40;
    CreateShip create_ship = 41;
    PlaceOrder place_order = 42;
    CancelOrder cancel_order = 43;
    GetMarket get_market = 44;
    GetHub get_hub = 45;
    // Economy (S1.3b)
    ListHubs list_hubs = 46;
  }
}

message FoundCity { string name = 1; LatLon pos = 2; }
message SetViewport { LatLon center = 1; double zoom = 2; double width_px = 3; double height_px = 4; }
message Authenticate { string token = 1; }
message MoveRuler { LatLon destination = 1; }
message InspectCity { string city_id = 1; }
message CityCellEdit { uint32 x = 1; uint32 y = 2; string layer = 3; string value = 4; }
message ApplyCityEdits { string city_id = 1; uint64 expected_revision = 2; repeated CityCellEdit edits = 3; }
message QueueBuilding { string city_id = 1; uint64 expected_revision = 2; string building_id = 3; uint32 x = 4; uint32 y = 5; uint32 orientation = 6; }
message CancelConstruction { string city_id = 1; uint64 expected_revision = 2; string order_id = 3; }

// Economy commands (S1.3)
message CreateCaravan {
  string city_id = 1;
  uint64 expected_revision = 2;
  string hub_id = 3;
  map<string, uint32> cargo = 4;
  uint64 metal = 5;
}
message CreateShip {
  string city_id = 1;
  uint64 expected_revision = 2;
  string hub_id = 3;
  map<string, uint32> cargo = 4;
  uint64 metal = 5;
}
message PlaceOrder {
  string hub_id = 1;
  string commodity = 2;
  int32 side = 3; // 0 = buy, 1 = sell
  double price = 4;
  uint32 quantity = 5;
}
message CancelOrder {
  string order_id = 1;
}
message GetMarket {
  string hub_id = 1;
  string commodity = 2;
}
message GetHub {
  string hub_id = 1;
}
message ListHubs {}

message AdminSnapshotRequest {
  uint64 after_event_seq = 1; string account_id = 2; string kingdom_id = 3;
  string city_id = 4; uint64 shard = 5; uint32 event_kind = 6;
  bool filter_shard = 7; bool filter_event_kind = 8;
  bool include_world = 9;
}

message RulerState {
  string id = 1; string kingdom_id = 2; LatLon pos = 3; uint32 supplies = 4;
  MoveSegment journey = 5; double journey_due_ms = 6; double founding_until_ms = 7;
  string city_id = 8; uint64 revision = 9;
}
message CityState {
  string id = 1; string kingdom_id = 2; string name = 3; LatLon pos = 4;
  uint32 tier = 5; bool active = 6; double ready_at_ms = 7; uint32 population = 8;
}
message TerritoryCell { string h3 = 1; string city_id = 2; repeated LatLon boundary = 3; }
message WorldSnapshot { RulerState ruler = 1; repeated CityState cities = 2; repeated TerritoryCell territory = 3; double now_ms = 4; uint32 village_cost = 5; double village_construction_ms = 6; }
message BuildingDefinition { string id = 1; string name_key = 2; uint32 width = 3; uint32 height = 4; double construction_ms = 5; repeated string zones = 6; bool water_required = 7; string visual_role = 8; }
message BuildingState { string id = 1; string building_id = 2; uint32 x = 3; uint32 y = 4; uint32 orientation = 5; bool complete = 6; }
message ConstructionState { string id = 1; string building_instance_id = 2; string building_id = 3; double due_at_ms = 4; string status = 5; }
message PopulationState { uint32 farmers = 1; uint32 artisans = 2; uint32 soldiers = 3; uint32 priests = 4; }
message CityMetrics { double water = 1; double density = 2; double defense = 3; double food_capacity = 4; double housing_capacity = 5; double fire_risk = 6; }
message CityEventState { string kind = 1; double started_at_ms = 2; double ends_at_ms = 3; }
message CitySnapshot {
  string city_id = 1; string kingdom_id = 2; string name = 3; uint32 width = 4; uint32 height = 5; uint64 revision = 6;
  bytes terrain_rle = 7; bytes roads_rle = 8; bytes zones_rle = 9;
  repeated BuildingState buildings = 10; repeated ConstructionState construction = 11;
  PopulationState population = 12; CityMetrics metrics = 13; repeated CityEventState events = 14;
  repeated BuildingDefinition definitions = 15; bool editable = 16; double now_ms = 17;
}
message EntityHandoff {
  string entity_id = 1; uint64 revision = 2; uint64 from_shard = 3;
  uint64 to_shard = 4; bytes state = 5;
}
message HandoffAck { string entity_id = 1; uint64 revision = 2; bool accepted = 3; }

message MoveSegment {
  string entity_id = 1;
  LatLon from = 2;
  LatLon to = 3;
  double t_start_ms = 4;
  double speed_mps = 5;
  string path_id = 6;
}

message EntityUpsert { string id = 1; uint32 kind = 2; LatLon pos = 3; string kingdom_id = 4; }
message EntityRemove { string id = 1; }
message ViewportSnapshot { repeated EntityUpsert entities = 1; }
message CommandResult { string request_id = 1; bool ok = 2; string error = 3; }
message EraChanged { uint32 era = 1; }
message AdminEvent {
  uint64 seq = 1; double at_ms = 2; uint64 shard = 3; uint32 kind = 4;
  string region = 5; string account_id = 6; string kingdom_id = 7;
  string city_id = 8; string payload_json = 9;
}
message AdminSnapshot {
  repeated CityState cities = 1; repeated EntityUpsert entities = 2;
  repeated AdminEvent events = 3; uint64 next_event_seq = 4; double generated_at_ms = 5;
  repeated TerritoryCell territory = 6;
}

message DesignParam { string id = 1; double value = 2; string choice = 3; }
message CurvePoint { double x = 1; double y = 2; }
message DesignCurve { string id = 1; repeated CurvePoint points = 2; }
message CreateDesign { string kind = 1; string name = 2; repeated DesignParam params = 3; repeated DesignCurve curves = 4; }
message MaterialSlotRef { string slot = 1; string batch_id = 2; }
message StartCraft { string design_id = 1; string workshop_id = 2; string craftsman_id = 3; repeated MaterialSlotRef slots = 4; }
message ResolveCheckpoint { string craft_id = 1; string checkpoint_id = 2; repeated DesignParam params = 3; }

// Economy server messages (S1.3)
message CaravanState {
  string id = 1;
  string kingdom_id = 2;
  string from_city = 3;
  string to_hub = 4;
  MoveSegment journey = 5;
  map<string, uint32> cargo = 6;
  uint64 metal = 7;
  uint64 revision = 8;
  string status = 9; // queued, traveling, at_hub
  double due_at_ms = 10;
}
message ShipState {
  string id = 1;
  string kingdom_id = 2;
  string from_city = 3;
  string to_hub = 4;
  MoveSegment journey = 5;
  map<string, uint32> cargo = 6;
  uint64 metal = 7;
  uint64 revision = 8;
  string status = 9; // queued, traveling, at_hub
  double due_at_ms = 10;
}
message HubState {
  string id = 1;
  string name = 2;
  LatLon pos = 3;
  string kingdom_id = 4;
  map<string, uint32> stock = 5;
  uint64 metal = 6;
  double fee = 7;
}
message OrderState {
  string id = 1;
  string hub_id = 2;
  string kingdom_id = 3;
  string commodity = 4;
  int32 side = 5;
  double price = 6;
  uint32 quantity = 7;
  uint32 filled_quantity = 8;
  uint64 placed_at_ms = 9;
  string status = 10;
}
message MarketSnapshot {
  string hub_id = 1;
  string commodity = 2;
  repeated OrderState buy_orders = 3;
  repeated OrderState sell_orders = 4;
  repeated OrderState recent_fills = 5;
  double local_price = 6;
  uint64 observed_at_ms = 7;
}

message ServerMsg {
  oneof kind {
    CommandResult result = 1;
    EntityUpsert upsert = 2;
    EntityRemove remove = 3;
    MoveSegment move = 4;
    EraChanged era = 8;
    ViewportSnapshot snapshot = 9;
    WorldSnapshot world = 10;
    CitySnapshot city = 11;
    AdminSnapshot admin = 12;
    // Economy (S1.3)
    CaravanState caravan = 13;
    ShipState ship = 14;
    HubState hub = 15;
    OrderState order = 16;
    MarketSnapshot market = 17;
    // Economy (S1.3b)
    HubsState hubs = 18;
  }
}

message HubsState { repeated HubState hubs = 1; }
